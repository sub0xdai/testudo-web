<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      let t = localStorage.getItem('testudo-theme');
      if (t === 'soft-dark') { t = 'amoled'; localStorage.setItem('testudo-theme', t); }
      if (t && t !== 'amoled') document.documentElement.setAttribute('data-theme', t);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TESTUDO | Trade Every Exchange From One Screen</title>
    <meta name="description" content="Multi-exchange trading aggregator with automated risk management. One interface. All your exchanges. Position sizing that adapts to volatility." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
